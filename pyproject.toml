[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assetwatch"
version = "0.1.0"
description = "Continuous authorized asset discovery and monitoring"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
assetwatch = "assetwatch.cli:main"

[tool.setuptools.packages.find]
include = ["assetwatch*"]
